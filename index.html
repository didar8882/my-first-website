<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менің алғашқы сайтым</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      color: #24304a;
      text-align: center;
      padding: 60px 20px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px #00000015;
    }

    h1 {
      color: #5b4bdb;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      background: #5b4bdb;
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Қош келдіңіз!</h1>
    <p>Бұл — менің алғашқы веб-сайтым.</p>
    <p>Мен сайт жасауды үйреніп жүрмін.</p>
    <a href="https://github.com/">GitHub сайты</a>
  </div>
</body>
</html>
